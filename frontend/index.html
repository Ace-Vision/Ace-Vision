<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ace Vision</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 0 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #666;
      margin-bottom: 40px;
    }

    /* --- Sport selection buttons --- */
    .sport-buttons {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
    }

    .sport-btn {
      flex: 1;
      padding: 24px;
      font-size: 1.1rem;
      border: 3px solid #ccc;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    /* Highlight the selected sport button */
    .sport-btn.selected {
      border-color: #1a73e8;
      background: #e8f0fe;
    }

    /* --- Skill level dropdown --- */
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    /* --- Analyse button --- */
    #analyse-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #analyse-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    /* --- Status message --- */
    #status {
      margin-top: 16px;
      color: #555;
      font-style: italic;
    }

    /* --- Results section --- */
    #results {
      margin-top: 40px;
      display: none; /* hidden until we have results */
    }

    #results h2 {
      margin-bottom: 16px;
    }

    /* Each joint result row */
    .joint-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: white;
      border-radius: 8px;
      margin-bottom: 8px;
      border-left: 6px solid #ccc;
    }

    .joint-row.good   { border-left-color: #4CAF50; }
    .joint-row.medium { border-left-color: #FF9800; }
    .joint-row.bad    { border-left-color: #F44336; }

    .joint-name {
      font-weight: bold;
      text-transform: replace;
    }

    .joint-detail {
      color: #555;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>Ace Vision</h1>
  <p class="subtitle">Choose a sport, pick your skill level, and get feedback on your technique.</p>

  <!-- Step 1: Choose a sport -->
  <label>Choose a sport</label>
  <div class="sport-buttons">
    <button class="sport-btn" data-sport="badminton" onclick="selectSport('badminton', this)">
      🏸 Badminton Clear
    </button>
    <button class="sport-btn" data-sport="tennis_serve" onclick="selectSport('tennis_serve', this)">
      🎾 Tennis Serve
    </button>
  </div>

  <!-- Step 2: Pick skill level -->
  <label for="skill-level">Skill level</label>
  <select id="skill-level">
    <option value="beginner">Beginner</option>
    <option value="intermediate" selected>Intermediate</option>
    <option value="advanced">Advanced</option>
  </select>

  <!-- Step 3: Analyse -->
  <button id="analyse-btn" onclick="runAnalysis()" disabled>
    Analyse
  </button>

  <p id="status"></p>

  <!-- Results appear here after the API responds -->
  <div id="results">
    <h2 id="results-title">Results</h2>
    <div id="joint-list"></div>
  </div>

  <script>
    // Keep track of which sport the user selected
    let selectedSport = null;

    // Called when the user clicks one of the sport buttons
    function selectSport(sport, button) {
      selectedSport = sport;

      // Remove the "selected" style from all buttons, then add it to the clicked one
      document.querySelectorAll('.sport-btn').forEach(btn => btn.classList.remove('selected'));
      button.classList.add('selected');

      // Now that a sport is chosen, enable the Analyse button
      document.getElementById('analyse-btn').disabled = false;
    }

    // Called when the user clicks the Analyse button
    async function runAnalysis() {
      const skillLevel = document.getElementById('skill-level').value;

      // Show a loading message while we wait for the API
      document.getElementById('status').textContent = 'Analysing... this may take a moment.';
      document.getElementById('analyse-btn').disabled = true;
      document.getElementById('results').style.display = 'none';

      // Build the request body to send to the backend
      const requestBody = {
        sport_type: selectedSport,
        skill_level: skillLevel,
      };

      try {
        // POST to the /analyse endpoint
        const response = await fetch('/analyse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody),
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const data = await response.json();
        showResults(data);

      } catch (error) {
        document.getElementById('status').textContent = `Error: ${error.message}`;
      } finally {
        // Re-enable the button so the user can try again
        document.getElementById('analyse-btn').disabled = false;
      }
    }

    // Takes the API response and displays each joint's deviation as a coloured row
    function showResults(data) {
      document.getElementById('status').textContent = '';

      const sportLabel = data.sport_type === 'badminton' ? 'Badminton Clear' : 'Tennis Serve';
      document.getElementById('results-title').textContent = `Results — ${sportLabel}`;

      const jointList = document.getElementById('joint-list');
      jointList.innerHTML = ''; // Clear any previous results

      const deviations = data.deviation_scores.deviations;

      // Create one row per joint
      for (const [joint, info] of Object.entries(deviations)) {
        const row = document.createElement('div');
        row.className = 'joint-row ' + getSeverityClass(info.severity_score);

        // Turn "right_elbow_flexion" into "Right Elbow Flexion"
        const jointName = joint.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

        row.innerHTML = `
          <span class="joint-name">${jointName}</span>
          <span class="joint-detail">
            ${info.angle.toFixed(1)}° &nbsp;|&nbsp;
            ${info.deviation_deg.toFixed(1)}° off &nbsp;|&nbsp;
            ${info.direction.replace('_', ' ')}
          </span>
        `;

        jointList.appendChild(row);
      }

      document.getElementById('results').style.display = 'block';
    }

    // Returns a CSS class name based on how severe the deviation is
    function getSeverityClass(score) {
      if (score < 0.3) return 'good';
      if (score < 0.6) return 'medium';
      return 'bad';
    }
  </script>

</body>
</html>
