services:
  - type: web
    name: ace-vision-backend
    runtime: python
    buildCommand: apt-get install -y libgles2 libgl1 && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ace-vision-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: ace-vision-db
    databaseName: ace_vision
    user: ace_vision_user
