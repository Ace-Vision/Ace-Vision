services:
  - type: web
    name: ace-vision-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ace-vision-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DISPLAY
        value: ":99"
      - key: MPLBACKEND
        value: "Agg"
      - key: MEDIAPIPE_DISABLE_GPU
        value: "1"

databases:
  - name: ace-vision-db
    databaseName: ace_vision
    user: ace_vision_user
