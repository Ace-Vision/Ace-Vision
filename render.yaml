services:
  - type: web
    name: ace-vision-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python -c "import ctypes.util, os, subprocess; subprocess.run(['gcc','-shared','-fPIC','-o','/opt/render/project/src/libGLESv2.so.2','-x','c','/dev/null'],check=False)"
    startCommand: LD_LIBRARY_PATH=/opt/render/project/src:$LD_LIBRARY_PATH uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ace-vision-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DISPLAY
        value: ":99"
      - key: MPLBACKEND
        value: "Agg"
      - key: MEDIAPIPE_DISABLE_GPU
        value: "1"

databases:
  - name: ace-vision-db
    databaseName: ace_vision
    user: ace_vision_user
